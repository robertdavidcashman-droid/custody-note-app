# When package.json / changelog.json under custody-note-app-source/ change on
# main/master, create tag v{version} if missing → triggers Release and deploy.

name: Auto-tag release if needed

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'custody-note-app-source/package.json'
      - 'custody-note-app-source/changelog.json'
  workflow_dispatch:

concurrency:
  group: auto-tag-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push release tag when missing
        run: |
          set -e
          VERSION=$(node -p "require('./custody-note-app-source/package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --quiet || true
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG} — Release and deploy workflow should start."
