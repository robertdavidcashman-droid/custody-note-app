# On push of a version tag (e.g. v1.9.52), build Windows + signed macOS installers,
# publish to GitHub Releases, then sync the marketing website.
#
# App source lives in custody-note-app-source/ (five-workspace layout).
#
# Prerequisites (Settings > Secrets and variables > Actions):
# - GITHUB_TOKEN (automatic)
# - Apple + Mac cert secrets for signed macOS builds
# - Optional: GH_PAT for website sync (robertdavidcashman-droid/custody-note-website)

name: Release and deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: custody-note-app-source

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: custody-note-app-source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: custody-note-app-source

      - name: Build + upload Windows installer to GitHub
        working-directory: custody-note-app-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  release-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: custody-note-app-source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: custody-note-app-source

      - name: Import Apple Developer ID certificate into a temporary keychain
        env:
          MAC_CERTIFICATE_P12_BASE64:   ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_P12_PASSWORD }}
          MAC_KEYCHAIN_PASSWORD:        ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cn-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cn-build.keychain-db"

          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          test -s "$CERT_PATH"

          security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain      -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERTIFICATE_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Preflight Apple notarization credentials
        working-directory: custody-note-app-source
        env:
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/preflight-apple-notary.mjs

      - name: Build, sign, notarise + upload macOS assets
        working-directory: custody-note-app-source
        env:
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          CN_PUBLISH:                  always
        run: npm run build:mac:signed

      - name: Regenerate latest-mac.yml from uploaded Mac assets
        working-directory: custody-note-app-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/repair-github-mac-updater-feed.mjs --tag "v${VERSION}"

  publish-release:
    runs-on: ubuntu-latest
    needs: [release-windows, release-mac]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Wait for cross-platform updater assets, then publish
        working-directory: custody-note-app-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          REQUIRED=(
            "Custody-Note-Setup-${VERSION}.exe"
            "Custody-Note-Setup-${VERSION}.exe.blockmap"
            "latest.yml"
            "Custody-Note-${VERSION}-arm64.dmg"
            "Custody-Note-${VERSION}-arm64.zip"
            "Custody-Note-${VERSION}-x64.dmg"
            "Custody-Note-${VERSION}-x64.zip"
            "latest-mac.yml"
          )
          for attempt in $(seq 1 30); do
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft \
                      --jq '.assets[].name' 2>/dev/null || echo "")
            missing=""
            for need in "${REQUIRED[@]}"; do
              echo "$assets" | grep -qx "$need" || missing+="$need "
            done
            if [ -z "$missing" ]; then
              echo "All asset names present — waiting 45s for GitHub uploads to settle…"
              sleep 45
              verify_ok=false
              for vattempt in $(seq 1 5); do
                echo "Verifying updater checksums (attempt $vattempt/5)…"
                if node scripts/verify-github-updater-assets.mjs --tag "$TAG"; then
                  verify_ok=true
                  break
                fi
                sleep 15
              done
              if [ "$verify_ok" != "true" ]; then
                echo "Checksum verification failed — attempting Mac updater feed repair…"
                node scripts/repair-github-mac-updater-feed.mjs --tag "$TAG" || true
                for vattempt in $(seq 1 12); do
                  echo "Post-repair verify (attempt $vattempt/12)…"
                  if node scripts/verify-github-updater-assets.mjs --tag "$TAG"; then
                    verify_ok=true
                    break
                  fi
                  sleep 15
                done
              fi
              if [ "$verify_ok" != "true" ]; then
                echo "Checksum verification still failed for $TAG — release stays draft."
                exit 1
              fi
              is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
              if [ "$is_draft" = "true" ]; then
                gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
                echo "Published $TAG after all cross-platform updater assets were uploaded."
              else
                echo "$TAG is already live."
                gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest || true
              fi
              exit 0
            fi
            echo "Waiting on $TAG (attempt $attempt): $missing"
            sleep 10
          done
          echo "Timed out waiting for updater assets on $TAG. Still missing: $missing"
          exit 1

  deploy-website:
    runs-on: ubuntu-latest
    needs: publish-release
    continue-on-error: true
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: robertdavidcashman-droid/custody-note-website
          path: custody-note-website
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: custody-note-app-source/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: custody-note-app-source

      - name: Configure git for website commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync website releases.json and push
        working-directory: custody-note-app-source
        env:
          WEBSITE_ROOT: ${{ github.workspace }}/custody-note-website
        run: node scripts/sync-website.mjs
