# Force production deploy of custodynote.com from private website master.
# Same pattern as policestationagent Deploy Production (web44ai): Vercel Git is
# not reliably linked, so this workflow is the authoritative production path.
#
# Trigger: push to master touching the sentinel file (workflow_dispatch is often
# blocked for the Cloud Agent integration token).
name: Force website production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/trigger-force-website-production-deploy'
      - '.github/workflows/force-website-production-deploy.yml'

concurrency:
  group: production-custody-note-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Hardcoded same as custody-note-website Deploy and IndexNow (web44ai pattern).
      # Secrets may override if set.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_wbvkpoLfvbg9qFwg5LqJLAjN' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_zPV1EYswHU0Nih1iASwSOxEY64NN' }}
      WEBSITE_REPO: robertcashman-bit/custody-note-website
      EXPECTED_PROJECT: custody-note-website
      PRODUCTION_URL: https://custodynote.com/
    steps:
      - name: Checkout app (for verify script)
        uses: actions/checkout@v4
        with:
          path: custody-note-app

      - name: Require secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in GH_PAT VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set GH_PAT and VERCEL_TOKEN in custody-note-app Actions secrets."
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "WARN: VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — will resolve via vercel link by project name."
          else
            echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID are set."
          fi

      - name: Confirm website master tip + PR #3
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "== PR #3 =="
          gh pr view 3 --repo "$WEBSITE_REPO" --json number,title,state,mergedAt,mergeCommit,url
          echo
          echo "== master tip =="
          gh api "repos/$WEBSITE_REPO/commits/master" --jq '{sha:.sha,date:.commit.committer.date,message:(.commit.message|split("\n")[0])}'
          SHA=$(gh api "repos/$WEBSITE_REPO/commits/master" --jq .sha)
          echo "MASTER_SHA=$SHA" >> "$GITHUB_ENV"
          echo
          echo "== Recent website Actions =="
          gh run list --repo "$WEBSITE_REPO" --branch master --limit 5 \
            --json databaseId,name,status,conclusion,url,headSha,event,createdAt

      - name: Checkout website master
        uses: actions/checkout@v4
        with:
          repository: robertcashman-bit/custody-note-website
          path: custody-note-website
          token: ${{ secrets.GH_PAT }}
          ref: master

      - name: Assert display markers in website source
        working-directory: custody-note-website
        run: |
          set -euo pipefail
          echo "Checked out SHA: $(git rev-parse HEAD)"
          echo "Expected merge: 5140b9c51df7e012832309f10c496430b66d352a (or descendant)"
          git log -1 --oneline
          HOME_PAGE=""
          for candidate in app/page.tsx src/app/page.tsx; do
            if [ -f "$candidate" ]; then HOME_PAGE="$candidate"; break; fi
          done
          if [ -z "$HOME_PAGE" ]; then
            echo "::error::homepage page.tsx not found"
            exit 1
          fi
          echo "HOME_PAGE=$HOME_PAGE"
          echo "== Hero CTA / framing greps =="
          grep -n "Download free\|View Features\|Free note generator\|max-w-lg\|ProductScreenshot\|hero" "$HOME_PAGE" | head -60 || true
          FLOAT=""
          for candidate in components/FloatingTrialCta.tsx src/components/FloatingTrialCta.tsx; do
            if [ -f "$candidate" ]; then FLOAT="$candidate"; break; fi
          done
          if [ -n "$FLOAT" ]; then
            echo "== Floating CTA =="
            grep -n "scroll\|viewport\|innerHeight\|delay\|threshold\|Download" "$FLOAT" | head -40 || true
          else
            echo "WARN: FloatingTrialCta.tsx not found"
          fi
          # Soft assertions — fail hard only when old hero CTAs clearly remain
          if grep -q "Free note generator" "$HOME_PAGE"; then
            echo "::error::Homepage still contains 'Free note generator' — master does not have display PR"
            exit 1
          fi
          if ! grep -q "Download free" "$HOME_PAGE"; then
            echo "::error::Homepage missing 'Download free'"
            exit 1
          fi
          if ! grep -q "View Features" "$HOME_PAGE"; then
            echo "::error::Homepage missing 'View Features'"
            exit 1
          fi
          echo "Source markers look like the new display (or compatible)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Inspect / link Vercel project
        working-directory: custody-note-website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          echo "== whoami =="
          vercel whoami --token="$VERCEL_TOKEN" || true
          echo "== teams =="
          vercel teams ls --token="$VERCEL_TOKEN" || true
          echo "== project inspect (by name) =="
          vercel project inspect "$EXPECTED_PROJECT" --token="$VERCEL_TOKEN" || true
          echo "== link =="
          # Prefer explicit IDs when present (web44ai pattern).
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
            cat .vercel/project.json
          else
            # Scope = team slug from MCP / dashboard
            vercel link --yes --project "$EXPECTED_PROJECT" --scope robert-cashmans-projects --token="$VERCEL_TOKEN" \
              || vercel link --yes --project "$EXPECTED_PROJECT" --token="$VERCEL_TOKEN"
            cat .vercel/project.json
          fi
          echo "== pull production env/settings =="
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        working-directory: custody-note-website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3"
            if OUT=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN"); then
              echo "$OUT"
              echo "$OUT" | tee /tmp/vercel-deploy-out.txt
              DEPLOY_URL=$(echo "$OUT" | tail -n 1 | tr -d '\r')
              echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed; retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

      - name: Verify live homepage markers
        working-directory: custody-note-app
        run: |
          set -euo pipefail
          echo "Deploy URL: ${DEPLOY_URL:-unknown}"
          echo "Polling $PRODUCTION_URL for new first-screen markers..."
          ok=0
          for i in $(seq 1 24); do
            if node scripts/verify-custodynote-live.cjs --html /tmp/live.html --write-proof /tmp/live-proof; then
              echo "LIVE markers OK on attempt $i"
              ok=1
              break
            fi
            echo "Attempt $i: not live yet; sleeping 15s"
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Production still does not show the new display after deploy."
            echo "Last HTML size: $(wc -c </tmp/live.html 2>/dev/null || echo 0)"
            exit 1
          fi

      - name: Upload live proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custodynote-live-proof
          path: |
            /tmp/live.html
            /tmp/live-proof/markers.txt
            /tmp/vercel-deploy-out.txt
          if-no-files-found: ignore
